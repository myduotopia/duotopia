name: Automated Release PR

# Trigger: human manually adds '✅ tested-in-staging' label via GitHub web UI.
# (Bot-added labels don't trigger workflows — for comment-driven flow see automation-auto-approve.yml.)

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  release-pr:
    if: github.event.label.name == '✅ tested-in-staging'
    uses: ./.github/workflows/_release-pr-shared.yml
    with:
      issue_number: ${{ github.event.issue.number }}
      issue_title: ${{ github.event.issue.title }}
    secrets: inherit
