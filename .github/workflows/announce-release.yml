name: Announce Release

# issue #804 — staging → main PR 一開就自動統整更新公告（等同本機 `/announce release`），
# 避免忘記在本機執行。
#
# 流程：
#   1. PR 描述已有完整公告區塊（本機 /announce release 寫過）→ 略過
#   2. scripts/release_announcement.py release-scan：找出 main..staging 內同時有
#      「📣 announce」與「✅ tested-in-staging」的 issue；一個都沒有 → 通知「本次不需公告」後結束
#   3. Claude Code（Opus 5.5）：替還沒有公告留言的 issue 補產內容，再統整成一則，只寫 JSON 檔
#   4. 用 RELEASE_PAT 寫回各 issue 留言與 PR 描述（寫入前再確認一次，本機版本優先）
#   5. LINE 通知 LINE_USER_ID
#
# pull_request 事件使用 PR merge commit 內的 workflow，合併進 staging 後下一次開
# staging → main PR 即生效。也可用 workflow_dispatch 指定 PR 編號手動重跑。

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'staging → main PR 編號'
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write # claude-code-action exchanges OIDC token for app token

jobs:
  announce-release:
    name: 📣 Announce release content
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'staging'
    runs-on: ubuntu-latest
    concurrency:
      group: announce-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Resolve PR and scan issues
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          PR="${EVENT_PR:-$INPUT_PR}"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

          python3 scripts/release_announcement.py pr-block "$PR" > block.json
          if [ "$(jq -r '.complete' block.json)" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ PR #$PR 描述已有完整公告區塊（本機 /announce release），不覆蓋"
            exit 0
          fi

          git fetch -q origin main staging
          python3 scripts/release_announcement.py release-scan \
            --base=origin/main --head=origin/staging > scan.json
          jq -r '.[] | "#\(.issue) eligible=\(.eligible) has_content=\(.content != null) \(.message // "")"' scan.json

          ELIGIBLE=$(jq -r '[.[] | select(.eligible) | .issue] | join(",")' scan.json)
          SKIPPED=$(jq -r '[.[] | select(.eligible | not) | .message] | join("\n")' scan.json)
          echo "eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"
          DELIM="SKIPPED_$(openssl rand -hex 16)"
          {
            echo "skipped<<$DELIM"
            printf '%s\n' "$SKIPPED"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$ELIGIBLE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "nothing=true" >> "$GITHUB_OUTPUT"
            echo "⏭️ 本次 release 沒有同時具備兩個標籤的 issue，不需公告"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            mkdir -p .announce
            cp scan.json .announce/scan.json
          fi

      - name: Generate release announcement with Claude Code
        if: steps.scan.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            你在 GitHub Actions 中自動整理 Duotopia 本次 release（staging → main，PR #${{ steps.scan.outputs.pr }}）的
            對外更新公告（issue #804 的 /announce 流程，模式 B）。

            1. 先讀 `.claude/skills/announce/SKILL.md`，嚴格遵守其中的「寫作原則」與「不要做」。
            2. 讀 `${{ github.workspace }}/.announce/scan.json`：本次 release 每個 issue 的判斷結果。
               只處理 `eligible: true` 的 issue（${{ steps.scan.outputs.eligible }}）。
            3. 對 `eligible: true` 但 `content` 為 null 的 issue，依 SKILL.md 模式 A 的步驟 2 了解改動
               （`gh issue view`、`gh pr list --search`、`git log origin/staging --grep "#N"` + `git show`），
               產生六個欄位寫成 `${{ github.workspace }}/.announce/issue-<N>.json`。
            4. 把所有 eligible issue 的內容（既有 content + 剛產生的）依 SKILL.md「統整版」原則合成**一則**，
               寫成 `${{ github.workspace }}/.announce/release.json`。只有一個 eligible issue 時直接沿用該則內容。
            5. 每個 JSON 檔都用 `python3 scripts/release_announcement.py render --content <檔案>` 確認格式正確。

            JSON 欄位：line_message_zh, line_message_en, article_title_zh, article_body_zh, article_title_en, article_body_en
            （line_message_zh 與 article_title_zh 必填；值一律是字串）

            限制：
            - **不要**寫入 GitHub（不要留言、不要編輯 issue / PR），寫入由後續步驟處理。
            - **不要**詢問使用者，這是非互動環境。
            - 不要修改 repo 內任何檔案，只寫上述 JSON 檔。
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowed-tools "Read,Write,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git branch:*),Bash(gh issue view:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(python3 scripts/release_announcement.py render:*)"

      - name: Write issue comments and PR description (as team member via RELEASE_PAT)
        id: publish
        if: steps.scan.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR: ${{ steps.scan.outputs.pr }}
          ELIGIBLE: ${{ steps.scan.outputs.eligible }}
        run: |
          set -euo pipefail
          if [ ! -s .announce/release.json ]; then
            echo "❌ Claude 沒有產生 .announce/release.json"
            exit 1
          fi
          python3 scripts/release_announcement.py render --content .announce/release.json > /dev/null

          # 補產的單一 issue 內容寫回 issue 留言（之後要改只要改留言）；已有留言的不覆蓋
          for f in .announce/issue-*.json; do
            [ -e "$f" ] || continue
            N=$(basename "$f" .json | sed 's/^issue-//')
            if [ "$(python3 scripts/release_announcement.py check "$N" | jq -r '.content != null')" = "true" ]; then
              echo "⏭️ #$N 已有公告留言，保留既有版本"
              continue
            fi
            python3 scripts/release_announcement.py upsert-issue "$N" --content "$f"
          done

          # 產生期間若有人在本機執行了 /announce release，以本機版本為準
          if [ "$(python3 scripts/release_announcement.py pr-block "$PR" | jq -r '.complete')" = "true" ]; then
            echo "⏭️ 產生期間 PR 描述已寫入公告區塊，保留既有版本"
            echo "url=$(gh pr view "$PR" --json url -q .url)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          URL=$(python3 scripts/release_announcement.py upsert-pr "$PR" \
            --content .announce/release.json --issues "$ELIGIBLE")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ 已寫入 PR 描述：$URL"

      - name: Notify LINE - release announcement ready
        if: steps.publish.outputs.url != '' || steps.scan.outputs.nothing == 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_USER_ID }}
          PR: ${{ steps.scan.outputs.pr }}
          URL: ${{ steps.publish.outputs.url }}
          ELIGIBLE: ${{ steps.scan.outputs.eligible }}
          SKIPPED: ${{ steps.scan.outputs.skipped }}
          NOTHING: ${{ steps.scan.outputs.nothing }}
        run: |
          if [ "$NOTHING" = "true" ]; then
            TEXT=$(printf '📣 staging → main PR #%s：本次沒有同時具備「📣 announce」與「✅ tested-in-staging」的 issue，不需公告。\n\n%s' "$PR" "$SKIPPED")
          else
            ISSUES=$(echo "$ELIGIBLE" | sed 's/,/、#/g')
            TEXT=$(printf '📣 staging → main PR #%s 的統整公告已自動寫入 PR 描述（#%s），請在合併前確認：\n%s\n\n要修改可直接編輯 PR 描述，或在本機執行 /announce release 重寫。' "$PR" "$ISSUES" "$URL")
          fi
          jq -n --arg to "$LINE_TO" --arg text "$TEXT" \
            '{to: $to, messages: [{type: "text", text: $text}]}' > line.json
          curl -s -X POST "https://api.line.me/v2/bot/message/push" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -d @line.json || true

      - name: Notify LINE - generation failed
        if: failure() && steps.scan.outputs.run == 'true'
        env:
          LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_USER_ID }}
          PR: ${{ steps.scan.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '⚠️ staging → main PR #%s 的統整公告自動產生失敗，請在本機執行 /announce release。\n%s' "$PR" "$RUN_URL")
          jq -n --arg to "$LINE_TO" --arg text "$TEXT" \
            '{to: $to, messages: [{type: "text", text: $text}]}' > line.json
          curl -s -X POST "https://api.line.me/v2/bot/message/push" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $LINE_TOKEN" \
            -d @line.json || true
