name: Release Announcement Draft

# issue #804 — release 進 staging / production 時，視需要產生一則「更新公告草稿」。
#
# 草稿只是草稿：內含 LINE 文案與官網雙語文章兩份內容，都不會自動對外發布。
# 管理者在後台（/api/admin/release-announcements）預覽、編輯、選擇要發 LINE、
# 官網或兩者。沒發的草稿可以併進下一次一起發，節省 LINE 每月訊息量。
#
# 要不要建草稿、帶什麼內容，由 scripts/release_announcement.py 決定
# （與 /announce skill 共用同一套規則）：
# - issue 同時有「📣 announce」與「✅ tested-in-staging」才建草稿；
#   沒有 issue 編號或標籤不齊 → 略過
# - staging：讀 issue 上 /announce 寫好的公告留言
# - main：讀 staging → main PR 描述內的統整公告區塊
# - 找不到現成內容 → 不帶 content，後端退回「解析 release 標題 → Vertex AI」
#
# 觸發用 push 而非 workflow_run：
# 1. workflow_run 只會執行 default branch（main）版本的 workflow，
#    推到 staging 時無法用 staging 上的版本測試。
# 2. 產生草稿只需要資料庫與 AI，不依賴新版程式已經上線。
# 部署失敗時仍會產生草稿，管理者在後台按「捨棄」即可。

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: '產生草稿的環境'
        required: true
        type: choice
        options:
          - staging
          - production
      commit_sha:
        description: '來源 commit sha（草稿去重用；production 會用它找 staging → main PR）'
        required: true
        type: string
      release_title:
        description: 'Release 標題（例：Release: [Feature]: ... (Fixes #123) (#456)）'
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  create-draft:
    name: 📢 Create release announcement draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/release_announcement.py
          sparse-checkout-cone-mode: false

      - name: Resolve environment and release info
        id: info
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_TITLE: ${{ inputs.release_title }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          INPUT_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="$INPUT_ENV"
            COMMIT_SHA="$INPUT_SHA"
            MESSAGE="$INPUT_TITLE"
          else
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              ENVIRONMENT="production"
            else
              ENVIRONMENT="staging"
            fi
            COMMIT_SHA="${{ github.sha }}"
            MESSAGE="$COMMIT_MESSAGE"
          fi

          {
            echo "environment=$ENVIRONMENT"
            echo "commit_sha=$COMMIT_SHA"
            echo "branch=${{ github.ref_name }}"
          } >> "$GITHUB_OUTPUT"

          # commit message 可能多行、含特殊字元，用 heredoc 形式寫入 output。
          # 分隔字串隨機產生：固定字串可被 commit message 內容提前結束，進而寫入任意 output
          DELIM="EOF_$(openssl rand -hex 16)"
          {
            echo "message<<$DELIM"
            printf '%s\n' "$MESSAGE"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Decide draft content (labels / issue comment / release PR)
        id: payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ steps.info.outputs.environment }}
          COMMIT_SHA: ${{ steps.info.outputs.commit_sha }}
          BRANCH: ${{ steps.info.outputs.branch }}
          COMMIT_MESSAGE: ${{ steps.info.outputs.message }}
        run: |
          set -euo pipefail

          # GitHub API 偶發失敗（rate limit / 5xx）時重試；仍失敗就讓 job 失敗，
          # 不退回「不檢查標籤」的草稿 —— 沒有標籤的更新不該被建成公告
          for attempt in 1 2 3; do
            if python3 scripts/release_announcement.py ci-payload \
                --environment "$ENVIRONMENT" \
                --sha "$COMMIT_SHA" \
                --branch "$BRANCH" \
                --commit-message "$COMMIT_MESSAGE" > payload.json; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "❌ 無法判斷是否需要建立草稿（GitHub API 失敗），可稍後用 workflow_dispatch 重跑"
              exit 1
            fi
            echo "⚠️  第 $attempt 次判斷失敗，15 秒後重試"
            sleep 15
          done
          cat payload.json
          ISSUES=$(jq -r '.issue_numbers // "—"' payload.json)

          if jq -e 'has("skip")' payload.json > /dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "result=⏭️ 略過：$(jq -r '.message' payload.json)" >> "$GITHUB_OUTPUT"
          elif jq -e 'has("content")' payload.json > /dev/null; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result=📝 使用 /announce 寫好的內容（issue: $ISSUES）" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "result=🤖 未使用 /announce 內容（issue 沒有公告留言，或同一次包含多個 issue 且無統整區塊），由後端以 Vertex AI 產生（issue: $ISSUES）" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft via backend webhook
        if: steps.payload.outputs.skip == 'false'
        env:
          BACKEND_URL: ${{ steps.info.outputs.environment == 'production' && secrets.PRODUCTION_BACKEND_URL || secrets.STAGING_BACKEND_URL }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${RELEASE_WEBHOOK_SECRET:-}" ] || [ -z "${BACKEND_URL:-}" ]; then
            echo "⚠️  缺少 RELEASE_WEBHOOK_SECRET 或 BACKEND_URL，略過草稿產生"
            exit 0
          fi

          # payload 已包含 environment / source_ref / release_title / issue_numbers
          # （以及選填的 content）；去掉 CI 專用欄位後直接送出
          jq 'del(.message)' payload.json > request.json

          echo "📢 產生更新公告草稿：${{ steps.info.outputs.environment }} / ${{ steps.info.outputs.commit_sha }}"

          # Cloud Run min-instances=0 時第一次請求可能 cold start，重試 3 次
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
              -X POST "${BACKEND_URL%/}/api/internal/release-announcements" \
              -H "Content-Type: application/json" \
              -H "X-Release-Secret: $RELEASE_WEBHOOK_SECRET" \
              --max-time 120 \
              -d @request.json) || HTTP_CODE="000"

            if [ "$HTTP_CODE" = "201" ]; then
              cat response.json
              echo ""
              echo "✅ 草稿已建立（後台可預覽、編輯、選擇發布 LINE / 官網）"
              exit 0
            fi

            echo "⚠️  第 $attempt 次嘗試失敗（HTTP $HTTP_CODE）"
            cat response.json 2>/dev/null || true
            sleep 10
          done

          echo "❌ 無法建立更新公告草稿"
          exit 1

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.payload.outputs.result }}
        run: |
          {
            echo "### 📢 更新公告草稿"
            echo ""
            echo "- 環境：\`${{ steps.info.outputs.environment }}\`"
            echo "- Commit：\`${{ steps.info.outputs.commit_sha }}\`"
            echo "- 結果：${RESULT:-（未執行）}"
            echo ""
            echo "草稿不會自動對外發布，請到後台選擇發布通道。"
          } >> "$GITHUB_STEP_SUMMARY"
