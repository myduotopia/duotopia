server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to staging backend
    location /api/ {
        proxy_pass https://duotopia-staging-backend-206313737181.asia-east1.run.app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Security headers（共用片段，見 frontend/security-headers.conf）
    include /etc/nginx/snippets/security-headers.conf;

    # index.html must never be cached (Issue #936): it points to hashed asset
    # chunks, so a stale index makes users load an old bundle after deploy.
    # NOTE: this file is currently NOT used by any Dockerfile (Dockerfile.staging
    # copies nginx.conf); kept consistent to avoid misleading future edits.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Cache static assets (content-hashed → safe to cache forever).
    # Same add_header non-inheritance gotcha as the index.html block above,
    # so the shared snippet is included here too (Issue #940).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}
