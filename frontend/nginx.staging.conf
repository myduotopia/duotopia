server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to staging backend
    location /api/ {
        proxy_pass https://duotopia-staging-backend-206313737181.asia-east1.run.app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Security headers（共用片段，見 frontend/security-headers.conf）
    include /etc/nginx/snippets/security-headers.conf;

    # index.html must never be cached (Issue #936): it points to hashed asset
    # chunks, so a stale index makes users load an old bundle after deploy.
    # NOTE: this file is currently NOT used by any Dockerfile (Dockerfile.staging
    # copies nginx.conf); kept consistent to avoid misleading future edits.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # .mjs (ES module) must be served as JavaScript (#1112): nginx:alpine's
    # mime.types has no mjs entry, so it falls back to application/octet-stream,
    # and with nosniff the browser refuses to load it as a module worker (e.g.
    # the pdf.js worker). The build already renames .mjs assets to .js; this is
    # a safety net. `types {}` is scoped to this location only (never at server
    # level, which would wipe every other MIME type). add_header does NOT inherit
    # into a location that has its own add_header, so re-declare security headers.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Cache static assets (content-hashed → safe to cache forever).
    # Same add_header non-inheritance gotcha as the index.html block above,
    # so the shared snippet is included here too (Issue #940).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
}
