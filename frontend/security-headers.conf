# 共用 security headers（Issue #940）
#
# 為什麼要獨立成一個檔：nginx 的 add_header 不會繼承到「自己也有 add_header 的
# location」，所以每個有 Cache-Control 的 location 都得再宣告一次。以前是各檔各
# location 複製貼上（3 檔 × 3 處 = 9 份），改壞一處很難察覺；現在統一 include。
#
# 這個檔案會被 Dockerfile COPY 到 /etc/nginx/snippets/security-headers.conf。
# 刻意「不」放 /etc/nginx/conf.d/：nginx 主設定有 include /etc/nginx/conf.d/*.conf，
# 放那裡會被當成 http-level 設定自動載入，變成非預期的全域 header。
#
# 改動這裡等於同時改動所有環境 → frontend/scripts/nginx-smoke-test.sh 會驗證。
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
